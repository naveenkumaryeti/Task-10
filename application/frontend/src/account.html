<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>My Account — QuikKart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<main class="container" style="padding-bottom:60px;">
  <h2 class="section-title">My Account</h2>
  <div class="auth-card" style="max-width:100%;margin-bottom:24px;" id="userCard"></div>

  <h3 class="section-title" style="font-size:16px;">
    <button class="btn btn-outline" id="viewOrdersBtn">View Orders</button>
  </h3>
  <div id="orders" style="display:none;"></div>
</main>
<div id="app-footer"></div>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/toast.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  renderHeader();
  renderFooter();
  let user = JSON.parse(localStorage.getItem("qk_user") || "null");
  if (!user) { window.location.href = "login.html"; return; }

  // Refresh from server so profile pic / phone are current
  try {
    user = await Api.getMyProfile();
    localStorage.setItem("qk_user", JSON.stringify(user));
  } catch { /* keep cached copy if offline */ }

  function renderCard() {
    const avatarHTML = user.profile_pic
      ? `<img src="${user.profile_pic}" class="avatar-circle" alt="">`
      : `<div class="avatar-placeholder">${user.name.charAt(0).toUpperCase()}</div>`;

    document.getElementById("userCard").innerHTML = `
      <div class="avatar-wrap">
        ${avatarHTML}
        <label class="avatar-upload-label">Change Photo
          <input type="file" id="picInput" accept="image/*">
        </label>
      </div>
      <div id="msg"></div>
      <div class="form-group"><label>Name</label><input id="nameInput" value="${user.name}"></div>
      <div class="form-group"><label>Email (cannot be changed)</label><input value="${user.email}" class="field-locked" disabled></div>
      <div class="form-group"><label>Phone</label><input id="phoneInput" value="${user.phone || ""}"></div>
      <div class="form-group"><label>New Password (leave blank to keep current)</label><input id="passwordInput" type="password" placeholder="••••••••"></div>
      <button class="auth-submit" id="saveBtn" style="max-width:220px;">Save Changes</button>
      <button class="btn btn-outline" id="logoutBtn" style="margin-top:12px;">Logout</button>`;

    document.getElementById("picInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const res = await Api.updateMyProfile({ profile_pic: reader.result });
          user = res.user;
          localStorage.setItem("qk_user", JSON.stringify(user));
          renderCard();
        } catch (err) {
          document.getElementById("msg").innerHTML = `<div class="error-msg">${err.message}</div>`;
        }
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const msg = document.getElementById("msg");
      const payload = {
        name: document.getElementById("nameInput").value.trim(),
        phone: document.getElementById("phoneInput").value.trim(),
      };
      const pwd = document.getElementById("passwordInput").value;
      if (pwd) payload.password = pwd;
      try {
        const res = await Api.updateMyProfile(payload);
        user = res.user;
        localStorage.setItem("qk_user", JSON.stringify(user));
        renderCard();
        document.getElementById("msg").innerHTML = `<div class="success-msg">Profile updated.</div>`;
      } catch (err) {
        msg.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("qk_token");
      localStorage.removeItem("qk_user");
      window.location.href = "index.html";
    });
  }
  renderCard();

  let ordersLoaded = false;
  const ordersEl = document.getElementById("orders");

  async function openOrders() {
    ordersEl.style.display = "block";
    if (ordersLoaded) return;
    ordersLoaded = true;
    try {
      const orders = await Api.getMyOrders();
      ordersEl.innerHTML = orders.length
        ? orders.map(o => `
          <div class="cart-item order-row" data-id="${o.id}" style="cursor:pointer;flex-direction:column;align-items:stretch;">
            <div style="display:flex;align-items:center;gap:14px;">
              <div style="flex:1;">
                <div class="cname">Order #${o.id} <span style="font-weight:400;color:var(--muted);font-size:12px;">(click to view items ▾)</span></div>
                <div class="cweight">${new Date(o.created_at).toLocaleString()} · ${o.payment_method}</div>
              </div>
              <div style="font-weight:700;">${currency(o.total_amount)}</div>
            </div>
            <div class="order-items" id="order-items-${o.id}" style="display:none;margin-top:12px;border-top:1px dashed #ddd;padding-top:12px;"></div>
          </div>`).join("")
        : `<div class="empty-state">No orders yet.</div>`;

      ordersEl.querySelectorAll(".order-row").forEach(row => {
        row.addEventListener("click", async () => {
          const id = row.dataset.id;
          const itemsEl = document.getElementById(`order-items-${id}`);
          const visible = itemsEl.style.display !== "none";
          if (visible) { itemsEl.style.display = "none"; return; }
          itemsEl.style.display = "block";
          if (itemsEl.dataset.loaded) return;
          itemsEl.dataset.loaded = "1";
          try {
            const items = await Api.getOrderItems(id);
            itemsEl.innerHTML = items.length
              ? items.map(it => `
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
                  <img src="${it.image_url}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:8px;">
                  <div style="flex:1;">
                    <div style="font-weight:600;font-size:13.5px;">${it.name}</div>
                    <div style="font-size:12px;color:var(--muted);">${it.weight} · Qty ${it.quantity}</div>
                  </div>
                  <div style="font-weight:700;">${currency(it.price * it.quantity)}</div>
                </div>`).join("")
              : `<div class="empty-state" style="padding:16px;">No item details found.</div>`;
          } catch {
            itemsEl.innerHTML = `<div class="empty-state" style="padding:16px;">Could not load items.</div>`;
          }
        });
      });
    } catch {
      ordersEl.innerHTML = `<div class="empty-state">Order history unavailable offline.</div>`;
    }
  }

  document.getElementById("viewOrdersBtn").addEventListener("click", () => {
    const visible = ordersEl.style.display !== "none";
    if (visible) { ordersEl.style.display = "none"; return; }
    openOrders();
  });

  // Deep-link support: account.html?tab=orders auto-opens the orders list
  if (new URLSearchParams(window.location.search).get("tab") === "orders") {
    openOrders();
  }
})();
</script>
</body>
</html>
