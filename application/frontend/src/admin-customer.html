<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Customers — QuikKart Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
<script>
(async function () {
  if (!requireAdmin()) return;
  renderAdminSidebar("customers");

  let customers = [];
  try { customers = await Api.adminGetCustomers(); } catch { customers = []; }

  document.getElementById("adminContent").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <input id="custSearch" placeholder="Search by name or email..." style="padding:10px 14px;border-radius:8px;border:1.5px solid #e5e7eb;width:260px;">
      <div style="font-weight:700;color:var(--brand-purple);">${customers.length} registered customer(s)</div>
    </div>
    <table class="admin-table">
      <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Joined On</th></tr></thead>
      <tbody id="custBody"></tbody>
    </table>
    <div class="empty-state" id="custEmpty" style="display:none;">No registered customers yet.</div>`;

  function row(c) {
    return `<tr>
      <td>#${c.id}</td>
      <td>${c.name}</td>
      <td>${c.email}</td>
      <td>${c.phone}</td>
      <td>${new Date(c.created_at).toLocaleString()}</td>
    </tr>`;
  }

  function render(list) {
    document.getElementById("custBody").innerHTML = list.map(row).join("");
    document.getElementById("custEmpty").style.display = list.length ? "none" : "block";
  }
  render(customers);

  document.getElementById("custSearch").addEventListener("input", (e) => {
    const q = e.target.value.toLowerCase();
    render(customers.filter(c => c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q)));
  });
})();
</script>
</body>
</html>
