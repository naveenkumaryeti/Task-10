<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Customers — QuikKart Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
<script>
(async function () {
  if (!requireAdmin()) return;
  renderAdminSidebar("customers");

  let customers = [];
  try { customers = await Api.adminGetCustomers(); } catch { customers = []; }

  document.getElementById("adminContent").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <input id="custSearch" placeholder="Search by name or email..." style="padding:10px 14px;border-radius:8px;border:1.5px solid #e5e7eb;width:260px;">
      <div style="display:flex;align-items:center;gap:16px;">
        <div style="font-weight:700;color:var(--brand-purple);" id="custCount">${customers.length} registered customer(s)</div>
        <button class="icon-btn" id="addCustBtn">+ Add Customer</button>
      </div>
    </div>
    <div id="addCustForm" style="display:none;" class="summary-card">
      <h3 style="margin-bottom:14px;">Add Customer</h3>
      <div id="addMsg"></div>
      <div class="form-group"><label>Name</label><input id="newName"></div>
      <div class="form-group"><label>Email</label><input id="newEmail" type="email"></div>
      <div class="form-group"><label>Phone</label><input id="newPhone"></div>
      <div class="form-group"><label>Password</label><input id="newPassword" type="password"></div>
      <div style="display:flex;gap:10px;">
        <button class="auth-submit" id="saveCustBtn" style="width:auto;padding:12px 24px;">Save Customer</button>
        <button class="btn btn-outline" id="cancelCustBtn" style="padding:12px 24px;">Cancel</button>
      </div>
    </div>
    <table class="admin-table">
      <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Joined On</th><th>Action</th></tr></thead>
      <tbody id="custBody"></tbody>
    </table>
    <div class="empty-state" id="custEmpty" style="display:none;">No registered customers yet.</div>`;

  function row(c) {
    return `<tr>
      <td>#${c.id}</td>
      <td>${c.name}</td>
      <td>${c.email}</td>
      <td>${c.phone}</td>
      <td>${new Date(c.created_at).toLocaleString()}</td>
      <td><button class="icon-btn danger" data-id="${c.id}" data-action="remove">Remove</button></td>
    </tr>`;
  }

  function render(list) {
    document.getElementById("custBody").innerHTML = list.map(row).join("");
    document.getElementById("custEmpty").style.display = list.length ? "none" : "block";
    document.getElementById("custCount").textContent = `${customers.length} registered customer(s)`;

    document.querySelectorAll('[data-action="remove"]').forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Remove this customer? This cannot be undone.")) return;
        try {
          await Api.adminDeleteCustomer(btn.dataset.id);
          customers = customers.filter(c => c.id != btn.dataset.id);
          render(customers);
        } catch (err) {
          alert(err.message);
        }
      });
    });
  }
  render(customers);

  document.getElementById("custSearch").addEventListener("input", (e) => {
    const q = e.target.value.toLowerCase();
    render(customers.filter(c => c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q)));
  });

  document.getElementById("addCustBtn").addEventListener("click", () => {
    document.getElementById("addCustForm").style.display = "block";
  });
  document.getElementById("cancelCustBtn").addEventListener("click", () => {
    document.getElementById("addCustForm").style.display = "none";
  });
  document.getElementById("saveCustBtn").addEventListener("click", async () => {
    const msg = document.getElementById("addMsg");
    const payload = {
      name: document.getElementById("newName").value.trim(),
      email: document.getElementById("newEmail").value.trim(),
      phone: document.getElementById("newPhone").value.trim(),
      password: document.getElementById("newPassword").value,
    };
    if (!payload.name || !payload.email || !payload.phone || !payload.password) {
      msg.innerHTML = `<div class="error-msg">All fields are required.</div>`;
      return;
    }
    try {
      const created = await Api.adminAddCustomer(payload);
      customers.unshift({ ...created, created_at: new Date().toISOString() });
      render(customers);
      document.getElementById("addCustForm").style.display = "none";
      ["newName", "newEmail", "newPhone", "newPassword"].forEach(id => document.getElementById(id).value = "");
    } catch (err) {
      msg.innerHTML = `<div class="error-msg">${err.message}</div>`;
    }
  });
})();
</script>
</body>
</html>
