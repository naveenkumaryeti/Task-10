<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>All Categories — QuikKart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<main class="container">
  <h2 class="section-title">All Categories</h2>
  <div class="category-grid" id="categoryGrid"></div>
</main>
<div id="app-footer"></div>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  renderHeader();
  renderFooter();
  const categories = await loadCategories();
  document.getElementById("categoryGrid").innerHTML = categories.map(c => `
    <a href="category.html?id=${c.id}" class="category-card">
      <div class="emoji">${c.emoji || getCategoryEmoji(c.id)}</div>
      <div class="cname">${c.name}</div>
    </a>`).join("");
})();
</script>
</body>
</html>
