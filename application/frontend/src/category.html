<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Category — QuikKart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<main class="container">
  <h2 class="section-title" id="catTitle">Products</h2>
  <div class="product-grid" id="productGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">No products found in this category.</div>
</main>
<div id="app-footer"></div>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/toast.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const catId = params.get("id");
  renderHeader(catId);
  renderFooter();

  const categories = await loadCategories();
  const cat = categories.find(c => c.id == catId);
  document.getElementById("catTitle").textContent = cat ? `${cat.emoji || getCategoryEmoji(cat.id)} ${cat.name}` : "Products";

  const products = await loadProducts(catId);
  const grid = document.getElementById("productGrid");
  if (!products.length) {
    document.getElementById("emptyState").style.display = "block";
  } else {
    grid.innerHTML = products.map(productCardHTML).join("");
    wireProductGrid(grid);
  }
})();
</script>
</body>
</html>
