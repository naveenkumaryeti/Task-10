<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Login — QuikKart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Welcome back 👋</h2>
    <p class="sub">Login to continue shopping on QuikKart</p>
    <div id="msg"></div>
    <div class="form-group"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div>
    <div class="form-group"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div>
    <button class="auth-submit" id="loginBtn">Login</button>
    <div class="auth-switch">New to QuikKart? <a href="signup.html">Create an account</a></div>
    <div class="auth-switch"><a href="admin-login.html">Login as Admin instead →</a></div>
  </div>
</div>
<div id="app-footer"></div>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
renderHeader();
renderFooter();

document.getElementById("loginBtn").addEventListener("click", async () => {
  const msg = document.getElementById("msg");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) { msg.innerHTML = `<div class="error-msg">Enter email and password.</div>`; return; }

  try {
    const res = await Api.login({ email, password });
    localStorage.setItem("qk_token", res.token);
    localStorage.setItem("qk_user", JSON.stringify(res.user));
    window.location.href = "index.html";
  } catch (err) {
    msg.innerHTML = `<div class="error-msg">${err.message || "Login failed. Check your credentials."}</div>`;
  }
});
</script>
</body>
</html>
