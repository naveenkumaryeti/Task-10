<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Product — QuikKart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<style>
  .pd-wrap{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding:30px 0 60px;}
  .pd-img{background:#fff;border-radius:20px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .pd-img img{border-radius:14px;width:100%;height:360px;object-fit:cover;}
  .pd-info h1{font-size:24px;margin-bottom:6px;}
  .pd-info .p-weight{font-size:14px;color:var(--muted);margin-bottom:16px;}
  .pd-price-block{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .pd-price-block .p-price{font-size:26px;font-weight:800;}
  .pd-desc{color:#444;line-height:1.7;font-size:14px;margin-top:24px;}
  @media(max-width:768px){
    .pd-wrap{grid-template-columns:1fr;padding-bottom:90px;}
    .sticky-add-bar{
      position:fixed;bottom:0;left:0;right:0;background:#fff;
      box-shadow:0 -4px 16px rgba(0,0,0,.1);padding:12px 16px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:60;
    }
  }
  @media(min-width:769px){.sticky-add-bar{display:none;}}
</style>
</head>
<body>
<div id="app-header"></div>
<main class="container">
  <div class="pd-wrap" id="pdWrap"></div>
</main>
<div class="sticky-add-bar" id="stickyAddBar" style="display:none;">
  <div>
    <div style="font-weight:800;" id="stickyPrice"></div>
  </div>
  <div id="stickyCartControl" style="flex:1;max-width:180px;"></div>
</div>
<div id="app-footer"></div>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/toast.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  renderHeader();
  renderFooter();
  const id = new URLSearchParams(window.location.search).get("id");
  const p = await loadProduct(id);
  if (!p) {
    document.getElementById("pdWrap").innerHTML = `<div class="empty-state">Product not found.</div>`;
    return;
  }
  const disc = discountPercent(p.price, p.mrp);
  const qty = Cart.get()[p.id] || 0;

  trackRecentlyViewed(p.id);
  const wished = Wishlist.has(p.id);

  document.getElementById("pdWrap").innerHTML = `
    <div class="pd-img" style="position:relative;">
      <button class="wishlist-heart ${wished ? "active" : ""}" id="pdWishBtn" style="position:absolute;top:14px;right:14px;">${wished ? "♥" : "♡"}</button>
      <img src="${p.image_url}" alt="${p.name}">
    </div>
    <div class="pd-info">
      <h1>${p.name}</h1>
      <div class="p-weight">${p.weight}</div>
      <div class="pd-price-block">
        <span class="p-price">${currency(p.price)}</span>
        ${disc > 0 ? `<span class="p-mrp">${currency(p.mrp)}</span><span class="discount-badge" style="position:static;">${disc}% OFF</span>` : ""}
      </div>
      <div id="pdCartControl">
        ${qty > 0
          ? `<div class="qty-control" style="width:140px;justify-content:space-between;"><button class="dec">−</button><span>${qty}</span><button class="inc">+</button></div>`
          : `<button class="btn btn-primary add-to-cart">Add to Cart</button>`}
      </div>
      <p class="pd-desc">Fresh, quality-checked ${p.name.toLowerCase()} sourced daily from trusted local suppliers and delivered to your door in minutes. Stored and packed under hygienic conditions.</p>
    </div>`;

  document.getElementById("pdWishBtn").addEventListener("click", (e) => {
    const isWished = Wishlist.toggle(p.id);
    e.target.textContent = isWished ? "♥" : "♡";
    e.target.classList.toggle("active", isWished);
    Toast.info(isWished ? "Added to wishlist" : "Removed from wishlist", 1500);
  });

  document.getElementById("pdCartControl").addEventListener("click", handleCartClick);

  const stickyBar = document.getElementById("stickyAddBar");
  const stickyControl = document.getElementById("stickyCartControl");
  document.getElementById("stickyPrice").textContent = currency(p.price);
  stickyBar.style.display = "flex";
  stickyControl.addEventListener("click", handleCartClick);

  function handleCartClick(e) {
    if (e.target.classList.contains("add-to-cart")) { Cart.add(p.id, 1); Toast.success("Added to cart", 1200); rerender(); }
    else if (e.target.classList.contains("inc")) { Cart.add(p.id, 1); rerender(); }
    else if (e.target.classList.contains("dec")) { Cart.setQty(p.id, (Cart.get()[p.id] || 0) - 1); rerender(); }
  }

  function rerender() {
    const q = Cart.get()[p.id] || 0;
    const html = q > 0
      ? `<div class="qty-control" style="width:140px;justify-content:space-between;"><button class="dec">−</button><span>${q}</span><button class="inc">+</button></div>`
      : `<button class="btn btn-primary add-to-cart">Add to Cart</button>`;
    document.getElementById("pdCartControl").innerHTML = html;
    stickyControl.innerHTML = html;
  }
  rerender(); // sync sticky bar with initial state
})();
</script>
</body>
</html>
