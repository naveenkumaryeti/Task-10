<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Search — QuikKart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<main class="container">
  <h2 class="section-title" id="searchTitle">Search results</h2>
  <div class="product-grid" id="productGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">No products matched your search.</div>
</main>
<div id="app-footer"></div>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  renderHeader();
  renderFooter();
  const q = new URLSearchParams(window.location.search).get("q") || "";
  document.getElementById("searchTitle").textContent = `Results for "${q}"`;
  document.getElementById("globalSearch").value = q;

  const products = await searchCatalog(q);
  const grid = document.getElementById("productGrid");
  if (!products.length) {
    document.getElementById("emptyState").style.display = "block";
  } else {
    grid.innerHTML = products.map(productCardHTML).join("");
    wireProductGrid(grid);
  }
})();
</script>
</body>
</html>
