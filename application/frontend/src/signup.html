<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Sign Up — QuikKart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="sub">Sign up and get groceries in 10 minutes</p>
    <div id="msg"></div>
    <div class="form-group"><label>Full Name</label><input id="name" placeholder="Your name"></div>
    <div class="form-group"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div>
    <div class="form-group"><label>Phone</label><input id="phone" placeholder="10-digit mobile number"></div>
    <div class="form-group"><label>Password</label><input id="password" type="password" placeholder="Min. 6 characters"></div>
    <button class="auth-submit" id="signupBtn">Create Account</button>
    <div class="auth-switch">Already have an account? <a href="login.html">Login</a></div>
  </div>
</div>
<div id="app-footer"></div>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
renderHeader();
renderFooter();

document.getElementById("signupBtn").addEventListener("click", async () => {
  const msg = document.getElementById("msg");
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;

  if (!name || !email || !phone || !password) { msg.innerHTML = `<div class="error-msg">Please fill in all fields.</div>`; return; }
  if (password.length < 6) { msg.innerHTML = `<div class="error-msg">Password must be at least 6 characters.</div>`; return; }

  try {
    const res = await Api.signup({ name, email, phone, password });
    localStorage.setItem("qk_token", res.token);
    localStorage.setItem("qk_user", JSON.stringify(res.user));
    window.location.href = "index.html";
  } catch (err) {
    msg.innerHTML = `<div class="error-msg">${err.message || "Signup failed. Try a different email."}</div>`;
  }
});
</script>
</body>
</html>
