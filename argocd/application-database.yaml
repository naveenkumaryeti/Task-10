apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zepto-database
  namespace: argocd

spec:
  project: zepto-platform

  source:
    repoURL: https://github.com/naveenkumaryeti/Task-10.git
    targetRevision: main
    path: helm/database
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: zepto

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m