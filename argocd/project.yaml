apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: zepto-platform
  namespace: argocd

spec:
  description: Zepto e-commerce 3-tier platform

  sourceRepos:
    - "https://github.com/naveenkumaryeti/Task-10.git"
    # or use "*" while developing

  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc

    - namespace: zepto
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"