apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: zepto-backend
    tier: backend

spec:
  type: {{ .Values.service.type }}

  selector:
    app: zepto-backend

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}