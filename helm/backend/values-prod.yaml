image:
  repository: asia-south1-docker.pkg.dev/zepto-with-gitops/prod-repo/zepto-backend
  tag: 73c0dba7092e53e41c9a7ab8659615352f3e305e
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

resources:
  requests:
    cpu: 150m
    memory: 200Mi
  limits:
    cpu: 500m
    memory: 400Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

rollingUpdate:
  maxUnavailable: 1
  maxSurge: 1

probes:
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 20
  startup:
    path: /healthz
    failureThreshold: 30
    periodSeconds: 5

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: backend-sa

# Env vars pulled from the Secret created by Bitnami Sealed Secrets
envSecretName: zepto-backend-secret
