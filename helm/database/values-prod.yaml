# This chart wraps the official Bitnami MySQL chart.
# Credentials are NEVER placed here — they come from the Kubernetes
# Secret produced by Bitnami Sealed Secrets (see /secrets folder).
mysql:
  image:
    registry: docker.io
    repository: bitnamilegacy/mysql
    tag: 8.4.3-debian-12-r0
  auth:
    existingSecret: zepto-db-secret
    database: zeptodb
    username: zepto

  architecture: standalone

  primary:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    persistence:
      enabled: true
      size: 10Gi

    podSecurityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1001
      fsGroup: 1001

    containerSecurityContext:
      enabled: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    initdbScriptsConfigMap: zepto-db-init-scripts

    readinessProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 2
      failureThreshold: 3

    startupProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 30

  serviceAccount:
    create: true
    name: database-sa