apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: zepto-frontend
    tier: frontend

spec:
  type: {{ .Values.service.type }}

  selector:
    app: zepto-frontend

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}