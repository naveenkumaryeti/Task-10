# values for kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    serviceMonitorSelectorNilUsesHelmValues: false

grafana:
  adminPassword: "ChangeMe123!"   # demo default — change immediately: kubectl -n monitoring exec ...
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  service:
    type: ClusterIP
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: zepto
          folder: Zepto
          type: file
          options:
            path: /var/lib/grafana/dashboards/zepto
  dashboardsConfigMaps:
    zepto: zepto-grafana-dashboards
