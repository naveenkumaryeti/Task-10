# Frontend can call backend on port 3000; backend accepts only from frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: zepto
spec:
  podSelector:
    matchLabels:
      app: zepto-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: zepto-frontend
      ports:
        - protocol: TCP
          port: 3000
