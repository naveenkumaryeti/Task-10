# Read-only role for backend service account (needs to read its own ConfigMaps only)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-role
  namespace: zepto
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
# Frontend needs no cluster access at all — role kept empty/minimal
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-role
  namespace: zepto
rules: []
---
# Database service account — no API access needed
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: database-role
  namespace: zepto
rules: []
---
# CI/CD (GitHub Actions -> GKE) deploy role, scoped to the namespace only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer-role
  namespace: zepto
rules:
  - apiGroups: ["", "apps", "autoscaling", "networking.k8s.io"]
    resources: ["pods", "services", "deployments", "horizontalpodautoscalers", "ingresses", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
